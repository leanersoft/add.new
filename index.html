per levels.&lt;/li&gt;\n    &lt;li&gt;Don’t use ‘&lt;code&gt;=&lt;/code&gt;’ for the document title; insert it with &lt;code&gt;#title()&lt;/code&gt; instead.&lt;/li&gt;\n  &lt;/ul&gt;\n  &lt;h2&gt;Lists&lt;/h2&gt;\n  &lt;ul&gt;\n    &lt;li&gt;&lt;code&gt;- item&lt;/code&gt; — bullet. &lt;code&gt;+ item&lt;/code&gt; — numbered. Note the space after the marker. &lt;code&gt;-item&lt;/code&gt; without a space is text; &lt;code&gt;- item&lt;/code&gt; is a list item.&lt;/li&gt;\n    &lt;li&gt;Indent by two spaces to continue or nest, aligning content with the left column.&lt;/li&gt;\n    &lt;li&gt;Switching markers (‘&lt;code&gt;-&lt;/code&gt;’ to ‘&lt;code&gt;+&lt;/code&gt;’ or back) starts a new list.&lt;/li&gt;\n    &lt;li&gt;Items may contain any markup structure, such as paragraphs, headings, quotes, or nested lists.&lt;/li&gt;\n  &lt;/ul&gt;\n  &lt;h2&gt;Quotes&lt;/h2&gt;\n  &lt;ul&gt;\n    &lt;li&gt;&lt;code&gt;&gt; text&lt;/code&gt; on a line starts a quote. Indent subsequent lines by two spaces.&lt;/li&gt;\n    &lt;li&gt;Repeated &lt;code&gt;&gt;&lt;/code&gt; at the start of a line begins a new quote each time; use indentation to continue the current quote.&lt;/li&gt;\n    &lt;li&gt;Rules for quote content are the same as for lists.&lt;/li&gt;\n    &lt;li&gt;&lt;code&gt;^ source&lt;/code&gt; adds quote attribution; align &lt;code&gt;^&lt;/code&gt; with &lt;code&gt;&gt;&lt;/code&gt;.&lt;/li&gt;\n  &lt;/ul&gt;\n  &lt;h2&gt;Inline marks&lt;/h2&gt;\n  &lt;ul&gt;\n    &lt;li&gt;&lt;code&gt;*strong*&lt;/code&gt;, &lt;code&gt;_emphasis_&lt;/code&gt;.&lt;/li&gt;\n    &lt;li&gt;&lt;code&gt;&amp;lt;https://example.com&gt;&lt;/code&gt; — link. &lt;code&gt;&amp;lt;https://example.com|label&gt;&lt;/code&gt; — link with text.&lt;/li&gt;\n    &lt;li&gt;&lt;code&gt;raw&lt;/code&gt; — keeps exact characters, useful for short syntax samples.&lt;/li&gt;\n    &lt;li&gt;&lt;code&gt;#$sqrt(x)$&lt;/code&gt; — inline math, with &lt;strong&gt;no&lt;/strong&gt; spaces inside the markers.&lt;/li&gt;\n    &lt;li&gt;&lt;code&gt;#$ sum_(i=0)^n i $&lt;/code&gt; — standalone math, &lt;strong&gt;with&lt;/strong&gt; spaces inside the markers.&lt;/li&gt;\n  &lt;/ul&gt;\n  &lt;h2&gt;Multi-part files&lt;/h2&gt;\n  &lt;p&gt;This feature is rarely needed, but may be useful when you want to keep multiple pieces of content in the same file.&lt;/p&gt;\n  &lt;ul&gt;\n    &lt;li&gt;&lt;code&gt;---&lt;/code&gt; on its own line — child part. The main part is the first part, &lt;em&gt;before&lt;/em&gt; this marker.&lt;/li&gt;\n    &lt;li&gt;&lt;code&gt;+++&lt;/code&gt; on its own line — sibling part. Starts a new top-level part, with its own main and optional child parts.&lt;/li&gt;\n    &lt;li&gt;Each part has its own properties and body, but child parts can also access properties from the main part as their own.&lt;/li&gt;\n    &lt;li&gt;Each part starts in &lt;strong&gt;code&lt;/strong&gt; mode.&lt;/li&gt;\n  &lt;/ul&gt;\n&lt;/div&gt;\n&quot;]}],[0,{&quot;slot&quot;:[0,&quot;2&quot;],&quot;html&quot;:[0,&quot;\n&lt;div&gt;\n  &lt;h2&gt;Values&lt;/h2&gt;\n  &lt;ul&gt;\n    &lt;li&gt;In numbers, groups of digits may be separated by spaces, commas, dots, underscores, or nothing. If a group separator is used, it must be consistent within the number. The fractional part may be separated by a comma or a dot, and must differ from the group separator.&lt;/li&gt;\n    &lt;li&gt;&lt;code&gt;{2026-05-20}&lt;/code&gt;, &lt;code&gt;{14:30}&lt;/code&gt;, &lt;code&gt;{2:30pm}&lt;/code&gt; — recognized date and time shapes; may be used as property values or appear in markup.&lt;/li&gt;\n    &lt;li&gt;&lt;code&gt;&#39;2026-05-20&#39;&lt;/code&gt; as a value — single quotes ensure it is &lt;em&gt;always&lt;/em&gt; interpreted as a date, number, time, date-time, keyword, etc., even if the same property name has been defined. To use it in markup, put it inside curly braces or after &lt;code&gt;#&lt;/code&gt;.&lt;/li&gt;\n  &lt;/ul&gt;\n  &lt;h2&gt;Properties&lt;/h2&gt;\n  &lt;p&gt;Can be set only in code mode.&lt;/p&gt;\n  &lt;ul&gt;\n    &lt;li&gt;&lt;code&gt;key: value&lt;/code&gt; — single-line property. The key may be a simple property name or a &lt;em&gt;path&lt;/em&gt;, with slash characters ‘&lt;code&gt;/&lt;/code&gt;’ acting like file path separators between parent paths and property names under them. The value is treated as markup and also accepts expressions in single quotes or curly braces.&lt;/li&gt;\n    &lt;li&gt;&lt;code&gt;path/&lt;/code&gt; followed by an indented body on subsequent lines — multi-line value, each line with 2-space indentation. It starts in code mode and may switch to markup with ‘&lt;code&gt;--&lt;/code&gt;’ or back with ‘&lt;code&gt;++&lt;/code&gt;’ on its own line, indented the same way as the other lines. Nested properties get &lt;code&gt;path/&lt;/code&gt; added to the start of their names.&lt;/li&gt;\n  &lt;/ul&gt;\n  &lt;h3&gt;Using a property in your document&lt;/h3&gt;\n  &lt;p&gt;Given a property named &lt;code&gt;work schedule&lt;/code&gt;:&lt;/p&gt;\n  &lt;ul&gt;\n    &lt;li&gt;&lt;code&gt;#work schedule&lt;/code&gt; or &lt;code&gt;{work schedule}&lt;/code&gt; — inserts the property value inline anywhere except raw code; curly braces are clearer because they mark where the property name ends.&lt;/li&gt;\n    &lt;li&gt;&lt;code&gt;#&#39;10 000,50&#39;&lt;/code&gt; in markup — literal value, matching &lt;code&gt;&#39;…&#39;&lt;/code&gt; in properties.&lt;/li&gt;\n  &lt;/ul&gt;\n  &lt;h2&gt;Common surprises&lt;/h2&gt;\n  &lt;p&gt;Preview stops updating and gets visually muted when there’s an error in code or markup.&lt;/p&gt;\n  &lt;ul&gt;\n    &lt;li&gt;Missing &lt;code&gt;--&lt;/code&gt; before markup.&lt;/li&gt;\n    &lt;li&gt;Without a blank line, subsequent lines belong to the same paragraph and are joined in the output with a space between them.&lt;/li&gt;\n    &lt;li&gt;Incorrect indentation — too few or too many spaces. Use exactly 2 spaces for each line of nested child content.&lt;/li&gt;\n    &lt;li&gt;Typos in property names.&lt;/li&gt;\n    &lt;li&gt;When&lt;span style=\&quot;white-space: pre-wrap\&quot;&gt;&amp;#x20;&lt;/span&gt;&lt;code&gt; ```&lt;span style=\&quot;white-space: pre-wrap\&quot;&gt;&amp;#x20;&lt;/span&gt;&lt;/code&gt; is used for &lt;em&gt;inline&lt;/em&gt; raw code examples, a single space is &lt;em&gt;required&lt;/em&gt; around the inner expression. Without it, behavior is not always correct, even though it works as expected in most cases. Any additional spaces are part of the expression.&lt;/li&gt;\n  &lt;/ul&gt;\n&lt;/div&gt;\n&quot;]}]]]}" ssr client="only" opts="{&quot;name&quot;:&quot;WriterApp&quot;,&quot;value&quot;:&quot;solid-js&quot;}"></astro-island> </body></html>
